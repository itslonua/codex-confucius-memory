[package]
name = "codex-memory"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Automatic context summaries and selective persistent notes for Codex"
license = "MIT"
repository = "https://github.com/itslonua/codex-confucius-memory"
readme = "README.md"
exclude = ["hooks.json"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
serde_yaml_ng = "0.10"
libc = "0.2"
fancy-regex = "0.16"
